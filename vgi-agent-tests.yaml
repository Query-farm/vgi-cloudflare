  - name: "platform_queues_with_consumers"
    reference_sql: |
      SELECT q.queue_name, CAST(q.consumers_total_count AS INTEGER) AS consumers_total_count FROM cloudflare.accounts.accounts a, cloudflare.workers.queues_by_account(a.id) q WHERE q.consumers_total_count > 0 ORDER BY q.queue_name
  - name: "platform_queue_retention"
    reference_sql: |
      SELECT q.queue_name, CAST(json_extract(q.settings, '$.message_retention_period') AS INTEGER) // 86400 AS retention_days FROM cloudflare.accounts.accounts a, cloudflare.workers.queues_by_account(a.id) q ORDER BY q.queue_name
  - name: "platform_container_registries"
    reference_sql: |
      SELECT r.domain, r.kind FROM cloudflare.accounts.accounts a, cloudflare.workers.registries_by_account(a.id) r ORDER BY r.domain
  - name: "platform_worker_routes_by_zone"
    reference_sql: |
      SELECT z.name AS zone_name, r.pattern, r.script FROM cloudflare.zones.zones z, cloudflare.workers.routes_by_zone(z.id) r ORDER BY zone_name, r.pattern
  - name: "platform_pipeline_sinks"
    reference_sql: |
      SELECT s.name, s.type, json_extract_string(s.format, '$.type') AS file_format, json_extract_string(s.format, '$.compression') AS compression FROM cloudflare.accounts.accounts a, cloudflare.workers.sinks_by_account(a.id) s ORDER BY s.name
  - name: "platform_pipeline_streams"
    reference_sql: |
      SELECT s.name, json_extract_string(s.format, '$.type') AS input_format, s.version FROM cloudflare.accounts.accounts a, cloudflare.workers.streams_by_account(a.id) s ORDER BY s.name
  - name: "platform_d1_databases_before_july"
    reference_sql: |
      SELECT d.name, d.version FROM cloudflare.accounts.accounts a, cloudflare.storage.database_by_account(a.id) d WHERE d.created_at < TIMESTAMPTZ '2026-07-01 00:00:00+00' ORDER BY d.created_at, d.name
  - name: "platform_kv_namespaces"
    reference_sql: |
      SELECT n.title, n.supports_url_encoding FROM cloudflare.accounts.accounts a, cloudflare.storage.namespaces_by_account(a.id) n ORDER BY n.title
  - name: "platform_public_ai_finetunes"
    reference_sql: |
      SELECT p.name, p.model FROM cloudflare.accounts.accounts a, cloudflare.ai.public_by_account(a.id) p ORDER BY p.name
  - name: "platform_ai_markdown_mime_types"
    reference_sql: |
      SELECT s.mimeType AS mime_type, count(*) AS extension_count FROM cloudflare.accounts.accounts a, cloudflare.ai.supported_by_account(a.id) s GROUP BY s.mimeType HAVING count(*) > 1 ORDER BY extension_count DESC, mime_type
  - name: "platform_alert_policies"
    reference_sql: |
      SELECT p.name, p.alert_type, p.enabled FROM cloudflare.accounts.accounts a, cloudflare.alerting.policies_by_account(a.id) p ORDER BY p.name
  - name: "platform_billing_cost_by_family_sept"
    reference_sql: |
      SELECT u.ServiceFamilyName AS service_family, round(sum(u.ContractedCost), 2) AS total_cost FROM cloudflare.accounts.accounts a, cloudflare.billing.paygo_usage_by_account(a.id) u WHERE u.ChargePeriodStart >= TIMESTAMPTZ '2026-09-10 00:00:00+00' AND u.ChargePeriodStart < TIMESTAMPTZ '2026-09-20 00:00:00+00' GROUP BY 1 ORDER BY total_cost DESC, service_family
  - name: "platform_container_applications"
    reference_sql: |
      SELECT c.name, c.max_instances FROM cloudflare.accounts.accounts a, cloudflare.workers.applications_by_account(a.id) c ORDER BY c.name
  - name: "platform_secrets_store_inventory"
    reference_sql: |
      SELECT s.name AS store_name, x.name AS secret_name, x.comment FROM cloudflare.accounts.accounts a, cloudflare.workers.stores_by_account(a.id) s, cloudflare.workers.secrets_by_store(a.id, s.id) x WHERE x.name LIKE '%attestation%' ORDER BY secret_name
  - name: "platform_queue_consumer_dlq"
    reference_sql: |
      SELECT c.queue_name, c.dead_letter_queue, CAST(json_extract(c.settings, '$.batch_size') AS INTEGER) AS batch_size, CAST(json_extract(c.settings, '$.max_retries') AS INTEGER) AS max_retries FROM cloudflare.accounts.accounts a, cloudflare.workers.queues_by_account(a.id) q, cloudflare.workers.consumers_by_queue(a.id, q.queue_id) c ORDER BY c.queue_name
  - name: "platform_queue_producers_detail"
    reference_sql: |
      SELECT d.queue_name, json_extract_string(p.value, '$.script') AS producer_script FROM cloudflare.accounts.accounts a, cloudflare.workers.queues_by_account(a.id) q, cloudflare.workers.queue(a.id, q.queue_id) d, json_each(d.producers) p ORDER BY d.queue_name, producer_script
  - name: "platform_pipeline_detail_tables"
    reference_sql: |
      SELECT d.name, CAST(json_array_length(d.tables) AS INTEGER) AS table_count FROM cloudflare.accounts.accounts a, cloudflare.workers.pipelines_by_account(a.id) p, cloudflare.workers.pipeline(a.id, p.id) d ORDER BY d.name
  - name: "platform_workers_account_defaults"
    reference_sql: |
      SELECT s.subdomain, w.default_usage_model, w.green_compute FROM cloudflare.accounts.accounts a, cloudflare.workers.subdomain(a.id) s, cloudflare.workers.account_settings(a.id) w
  - name: "platform_workers_secrets_quota"
    reference_sql: |
      SELECT CAST(json_extract(q.secrets, '$.quota') AS INTEGER) AS secrets_quota FROM cloudflare.accounts.accounts a, cloudflare.workers.quota(a.id) q
  - name: "platform_workers_aws_regions"
    reference_sql: |
      SELECT json_extract_string(r.value, '$.id') AS region_id FROM cloudflare.accounts.accounts a, cloudflare.workers.regions(a.id) g, json_each(g.providers) p, json_each(json_extract(p.value, '$.regions')) r WHERE json_extract_string(p.value, '$.id') = 'aws' AND json_extract_string(r.value, '$.id') LIKE 'ap-northeast-%' ORDER BY region_id
  - name: "platform_ai_credit_limits"
    reference_sql: |
      SELECT l.currency, l.min_cents, l.max_cents, s.enabled AS spending_limit_enabled, CAST(json_extract(s.config, '$.amount') AS INTEGER) AS limit_amount, json_extract_string(s.config, '$.duration') AS limit_duration FROM cloudflare.accounts.accounts a, cloudflare.ai.limits(a.id) l, cloudflare.ai.spending_limit(a.id) s
  - name: "platform_ai_topup_config"
    reference_sql: |
      SELECT c.amount AS topup_amount, c.threshold AS topup_threshold FROM cloudflare.accounts.accounts a, cloudflare.ai.config(a.id) c
  - name: "platform_cron_triggers"
    reference_sql: |
      SELECT s.id AS script_name, json_extract_string(c.value, '$.cron') AS cron FROM cloudflare.accounts.accounts a, cloudflare.workers.scripts_by_account(a.id) s, cloudflare.workers.schedules(a.id, s.id) sc, json_each(sc.schedules) c WHERE s.handlers LIKE '%"scheduled"%' ORDER BY script_name, cron
  - name: "platform_scripts_workersdev_enabled"
    reference_sql: |
      SELECT s.id AS script_name, d.previews_enabled FROM cloudflare.accounts.accounts a, cloudflare.workers.scripts_by_account(a.id) s, cloudflare.workers.scripts_subdomain(a.id, s.id) d WHERE s.created_on < TIMESTAMPTZ '2026-09-01 00:00:00+00' AND d.enabled ORDER BY script_name
  - name: "platform_scripts_observability_off"
    reference_sql: |
      SELECT s.id AS script_name, st.logpush FROM cloudflare.accounts.accounts a, cloudflare.workers.scripts_by_account(a.id) s, cloudflare.workers.script_settings(a.id, s.id) st WHERE s.created_on < TIMESTAMPTZ '2026-09-01 00:00:00+00' AND coalesce(CAST(json_extract(st.observability, '$.enabled') AS BOOLEAN), false) = false ORDER BY script_name
  - name: "platform_script_secret_counts"
    reference_sql: |
      SELECT s.id AS script_name, count(*) AS secret_count FROM cloudflare.accounts.accounts a, cloudflare.workers.scripts_by_account(a.id) s, cloudflare.workers.scripts_secrets_by_script(a.id, s.id) x WHERE s.created_on < TIMESTAMPTZ '2026-09-01 00:00:00+00' GROUP BY s.id ORDER BY secret_count DESC, script_name LIMIT 5
  - name: "platform_haybarn_status_secrets"
    reference_sql: |
      SELECT x.name, x.type FROM cloudflare.accounts.accounts a, cloudflare.workers.scripts_secrets_by_script(a.id, 'haybarn-status') x ORDER BY x.name
  - name: "platform_latest_deployment_haybarn_status"
    reference_sql: |
      SELECT json_extract_string(d.value, '$.source') AS source, json_extract_string(d.value, '$.strategy') AS strategy, CAST(json_extract(d.value, '$.versions[0].percentage') AS INTEGER) AS version_percentage FROM cloudflare.accounts.accounts a, cloudflare.workers.deployments(a.id, 'haybarn-status') x, json_each(x.deployments) d ORDER BY CAST(json_extract_string(d.value, '$.created_on') AS TIMESTAMPTZ) DESC LIMIT 1
  - name: "platform_pipeline_sink_destinations"
    reference_sql: |
      SELECT d.name, json_extract_string(d.config, '$.bucket') AS bucket, json_extract_string(d.config, '$.path') AS path, CAST(json_extract(d.config, '$.rolling_policy.interval_seconds') AS INTEGER) AS interval_seconds FROM cloudflare.accounts.accounts a, cloudflare.workers.sinks_by_account(a.id) s, cloudflare.workers.sink(a.id, s.id) d ORDER BY d.name
  - name: "platform_pipeline_stream_http"
    reference_sql: |
      SELECT d.name, CAST(json_extract(d.http, '$.enabled') AS BOOLEAN) AS http_enabled, CAST(json_extract(d.http, '$.authentication') AS BOOLEAN) AS http_authentication FROM cloudflare.accounts.accounts a, cloudflare.workers.streams_by_account(a.id) s, cloudflare.workers.stream(a.id, s.id) d ORDER BY d.name
  - name: "platform_custom_domain_details_query_farm"
    reference_sql: |
      SELECT d.hostname, d.service FROM cloudflare.accounts.accounts a, cloudflare.workers.domains_by_account(a.id) l, cloudflare.workers.domain(a.id, l.id) d WHERE d.zone_name = 'query.farm' ORDER BY d.hostname
  - name: "platform_worker_detail_observability_march"
    reference_sql: |
      SELECT d.name, CAST(json_extract(d.observability, '$.enabled') AS BOOLEAN) AS observability_enabled FROM cloudflare.accounts.accounts a, cloudflare.workers.workers_by_account(a.id) w, cloudflare.workers.worker(a.id, w.id) d WHERE w.created_on >= TIMESTAMPTZ '2026-03-01 00:00:00+00' AND w.created_on < TIMESTAMPTZ '2026-04-01 00:00:00+00' ORDER BY d.name
  - name: "platform_haybarn_status_versions_may"
    reference_sql: |
      SELECT count(*) AS version_count, min(v.number) AS first_number, max(v.number) AS last_number FROM cloudflare.accounts.accounts a, cloudflare.workers.workers_by_account(a.id) w, cloudflare.workers.versions_2_by_worker(a.id, w.id) v WHERE w.name = 'haybarn-status' AND v.created_on >= TIMESTAMPTZ '2026-05-01 00:00:00+00' AND v.created_on < TIMESTAMPTZ '2026-06-01 00:00:00+00'
  - name: "platform_haybarn_status_deployable_versions"
    reference_sql: |
      SELECT CAST(json_array_length(x.items) AS INTEGER) AS deployable_version_count FROM cloudflare.accounts.accounts a, cloudflare.workers.versions_by_id(a.id, 'haybarn-status', deployable := true) x
  - name: "platform_container_app_resources"
    reference_sql: |
      SELECT d.name, CAST(json_extract(d.configuration, '$.vcpu') AS DOUBLE) AS vcpu, CAST(json_extract(d.configuration, '$.memory_mib') AS INTEGER) AS memory_mib, CAST(json_extract(d.configuration, '$.disk.size_mb') AS INTEGER) AS disk_mb FROM cloudflare.accounts.accounts a, cloudflare.workers.applications_by_account(a.id) c, cloudflare.workers.application(a.id, c.id) d ORDER BY d.name
  - name: "platform_container_app_rollout_versions"
    reference_sql: |
      SELECT c.name, v.version, v.percentage FROM cloudflare.accounts.accounts a, cloudflare.workers.applications_by_account(a.id) c, cloudflare.workers.applications_versions_by_application(a.id, c.id) v ORDER BY c.name, v.version
  - name: "platform_kv_namespace_lookup_key_registry"
    reference_sql: |
      SELECT d.title, d.id FROM cloudflare.accounts.accounts a, cloudflare.storage.namespaces_by_account(a.id) n, cloudflare.storage.namespace(a.id, n.id) d WHERE d.title LIKE 'KEY_REGISTRY%' ORDER BY d.title
  - name: "platform_kv_keys_egress_config"
    reference_sql: |
      SELECT k.name AS key_name FROM cloudflare.accounts.accounts a, cloudflare.storage.namespaces_by_account(a.id) n, cloudflare.storage.keys_by_namespace(a.id, n.id) k WHERE n.title = 'vgi-egress-proxy-config' ORDER BY key_name
  - name: "platform_alert_policy_detail"
    reference_sql: |
      SELECT d.name, d.description, (SELECT string_agg(k, ',' ORDER BY k) FROM (SELECT unnest(json_keys(d.mechanisms)) AS k)) AS mechanism_types FROM cloudflare.accounts.accounts a, cloudflare.alerting.policies_by_account(a.id) p, cloudflare.alerting.policy(a.id, p.id) d ORDER BY d.name
  - name: "platform_haybarn_status_bindings"
    reference_sql: |
      SELECT json_extract_string(b.value, '$.name') AS name, json_extract_string(b.value, '$.type') AS type FROM cloudflare.accounts.accounts a, cloudflare.workers.settings(a.id, 'haybarn-status') s, json_each(s.bindings) b ORDER BY name
  - name: "platform_latest_deployment_version_number"
    reference_sql: |
      WITH latest AS (SELECT a.id AS account_id, json_extract_string(d.value, '$.id') AS deployment_id FROM cloudflare.accounts.accounts a, cloudflare.workers.deployments(a.id, 'haybarn-status') x, json_each(x.deployments) d ORDER BY CAST(json_extract_string(d.value, '$.created_on') AS TIMESTAMPTZ) DESC LIMIT 1) SELECT dep.source AS deployment_source, CAST(v.number AS INTEGER) AS version_number, CAST(json_extract(dep.versions, '$[0].percentage') AS INTEGER) AS percentage FROM latest l, cloudflare.workers.deployment(l.account_id, 'haybarn-status', l.deployment_id) dep, cloudflare.workers.versions_version(l.account_id, 'haybarn-status', json_extract_string(dep.versions, '$[0].version_id')) v
  - name: "platform_acct_scripts_queue_handlers"
    reference_sql: |
      WITH t AS MATERIALIZED (SELECT * FROM cloudflare.workers.scripts WHERE account_id = 'bb68a133a66d26a310231495b13479a1') SELECT id AS script_name, handlers FROM t WHERE handlers LIKE '%"queue"%' ORDER BY script_name
  - name: "platform_acct_custom_domains_per_zone"
    reference_sql: |
      WITH t AS MATERIALIZED (SELECT * FROM cloudflare.workers.domains WHERE account_id = 'bb68a133a66d26a310231495b13479a1') SELECT zone_name, count(*) AS domain_count FROM t WHERE service LIKE 'vgi-%' GROUP BY zone_name ORDER BY zone_name
  - name: "platform_acct_stockgate_d1"
    reference_sql: |
      WITH t AS MATERIALIZED (SELECT * FROM cloudflare.storage.database WHERE account_id = 'bb68a133a66d26a310231495b13479a1') SELECT name, uuid FROM t WHERE name LIKE 'stockgate%' ORDER BY name
  - name: "platform_acct_dead_letter_queues"
    reference_sql: |
      WITH t AS MATERIALIZED (SELECT * FROM cloudflare.workers.queues WHERE account_id = 'bb68a133a66d26a310231495b13479a1') SELECT queue_name, substr(created_on, 1, 10) AS created_date FROM t WHERE queue_name LIKE '%-dlq' ORDER BY queue_name
  - name: "platform_zone_routes_query_farm_services"
    reference_sql: |
      WITH t AS MATERIALIZED (SELECT * FROM cloudflare.workers.routes WHERE zone_id = '9b3308c61327a270a88bfe105f239e37') SELECT pattern, script FROM t ORDER BY pattern
  - name: "platform_acct_do_namespaces_stockgate"
    reference_sql: |
      WITH t AS MATERIALIZED (SELECT * FROM cloudflare.workers.durable_objects_namespaces WHERE account_id = 'bb68a133a66d26a310231495b13479a1') SELECT class, use_sqlite FROM t WHERE script = 'stockgate-dev' ORDER BY class
  - name: "platform_acct_workers_d1_grainlift"
    reference_sql: |
      WITH t AS MATERIALIZED (SELECT * FROM cloudflare.workers.workers WHERE account_id = 'bb68a133a66d26a310231495b13479a1') SELECT name, strftime(created_on AT TIME ZONE 'UTC', '%Y-%m-%d') AS created_date FROM t WHERE name LIKE 'grainlift%' ORDER BY name
  - name: "platform_acct_billing_r2_storage_sept"
    reference_sql: |
      WITH t AS MATERIALIZED (SELECT * FROM cloudflare.billing.paygo_usage WHERE account_id = 'bb68a133a66d26a310231495b13479a1') SELECT ServiceName AS service_name, round(sum(ConsumedQuantity), 2) AS consumed_quantity FROM t WHERE ServiceFamilyName = 'R2' AND ChargePeriodStart >= TIMESTAMPTZ '2026-09-10 00:00:00+00' AND ChargePeriodStart < TIMESTAMPTZ '2026-09-20 00:00:00+00' GROUP BY 1 ORDER BY service_name
  - name: "platform_acct_ai_public_finetune_dates"
    reference_sql: |
      WITH t AS MATERIALIZED (SELECT * FROM cloudflare.ai.public WHERE account_id = 'bb68a133a66d26a310231495b13479a1') SELECT name, strftime(created_at AT TIME ZONE 'UTC', '%Y-%m-%d') AS created_date FROM t ORDER BY created_date, name
  - name: "platform_acct_scripts_search_count_2025"
    reference_sql: |
      WITH t AS MATERIALIZED (SELECT * FROM cloudflare.workers.scripts_search WHERE account_id = 'bb68a133a66d26a310231495b13479a1') SELECT count(*) AS script_count FROM t WHERE created_on >= TIMESTAMPTZ '2025-01-01 00:00:00+00' AND created_on < TIMESTAMPTZ '2026-01-01 00:00:00+00'
  - name: "net_zones_by_creation"
    reference_sql: |
      SELECT name AS zone_name, status, created_on FROM cloudflare.zones.zones ORDER BY created_on, name
  - name: "net_zone_lookup_activation"
    reference_sql: |
      SELECT x.name AS zone_name, x.activated_on, x.paused FROM cloudflare.zones.zones z, cloudflare.zones.zone(z.id) x ORDER BY x.name
  - name: "net_page_rules_targets"
    reference_sql: |
      SELECT z.name AS zone_name, json_extract_string(p.targets, '$[0].constraint.value') AS url_pattern, p.priority, p.status FROM cloudflare.zones.zones z, cloudflare.zones.pagerules_by_zone(z.id) p ORDER BY z.name, p.priority, url_pattern
  - name: "net_page_rule_action_count"
    reference_sql: |
      SELECT z.name AS zone_name, json_extract_string(x.targets, '$[0].constraint.value') AS url_pattern, json_array_length(x.actions) AS action_count FROM cloudflare.zones.zones z, cloudflare.zones.pagerules_by_zone(z.id) p, cloudflare.zones.pagerule(z.id, p.id) x ORDER BY zone_name, url_pattern
  - name: "net_page_rules_qfs_literal"
    reference_sql: |
      SELECT count(*) AS total_rules, count(*) FILTER (WHERE status = 'active') AS active_rules FROM cloudflare.zones.pagerules WHERE zone_id = '9b3308c61327a270a88bfe105f239e37'
  - name: "net_speed_pages"
    reference_sql: |
      SELECT z.name AS zone_name, p.url AS page_url, json_extract_string(p.region, '$.label') AS region_label FROM cloudflare.zones.zones z, cloudflare.zones.pages_by_zone(z.id) p ORDER BY zone_name, page_url
  - name: "net_speed_pages_qf_literal"
    reference_sql: |
      SELECT url AS page_url, json_extract_string(region, '$.value') AS region_code FROM cloudflare.zones.pages WHERE zone_id = 'f762db64a4e321f026a26321acf2b65b' ORDER BY page_url
  - name: "net_settings_on_count"
    reference_sql: |
      SELECT z.name AS zone_name, count(*) FILTER (WHERE s.value = 'on') AS settings_on, count(*) FILTER (WHERE NOT s.editable) AS not_editable FROM cloudflare.zones.zones z, cloudflare.zones.settings_by_zone(z.id) s GROUP BY z.name ORDER BY z.name
  - name: "net_settings_qf_tls_literal"
    reference_sql: |
      SELECT id AS setting_id, value FROM cloudflare.zones.settings WHERE zone_id = 'f762db64a4e321f026a26321acf2b65b' AND id IN ('min_tls_version', 'tls_1_3', 'ssl', 'always_use_https') ORDER BY setting_id
  - name: "net_setting_lookup_ssl_mode"
    reference_sql: |
      SELECT z.name AS zone_name, s.value AS ssl_mode, m.value AS min_tls_version FROM cloudflare.zones.zones z, cloudflare.zones.setting(z.id, 'ssl') s, cloudflare.zones.setting(z.id, 'min_tls_version') m ORDER BY zone_name
  - name: "net_ssl_automatic_mode"
    reference_sql: |
      SELECT z.name AS zone_name, x.value AS automatic_mode FROM cloudflare.zones.zones z, cloudflare.zones.ssl_automatic_mode(z.id) x ORDER BY zone_name
  - name: "net_perf_features"
    reference_sql: |
      SELECT z.name AS zone_name, sb.value AS speed_brain, f.value AS fonts, tc.value AS tiered_caching FROM cloudflare.zones.zones z, cloudflare.zones.speed_brain(z.id) sb, cloudflare.zones.fonts(z.id) f, cloudflare.zones.tiered_caching(z.id) tc ORDER BY zone_name
  - name: "net_origin_protocol_settings"
    reference_sql: |
      SELECT z.name AS zone_name, v.value AS origin_max_http_version, h.value AS origin_h2_max_streams, q.value AS origin_pqe FROM cloudflare.zones.zones z, cloudflare.zones.origin_max_http_version(z.id) v, cloudflare.zones.origin_h2_max_streams(z.id) h, cloudflare.zones.origin_post_quantum_encryption(z.id) q ORDER BY zone_name
  - name: "net_egress_tls_features"
    reference_sql: |
      SELECT z.name AS zone_name, json_extract(ae.value, '$.enabled')::BOOLEAN AS aegis_enabled, k.enabled AS auto_origin_tls_kex_enabled, st.value AS smart_topology FROM cloudflare.zones.zones z, cloudflare.zones.aegis(z.id) ae, cloudflare.zones.auto_origin_tls_kex(z.id) k, cloudflare.zones.tiered_cache_smart_topology_enable(z.id) st ORDER BY zone_name
  - name: "net_rum_and_tls_compliance"
    reference_sql: |
      SELECT z.name AS zone_name, r.value AS rum, json_array_length(c.value) AS compliance_mode_count FROM cloudflare.zones.zones z, cloudflare.zones.rum(z.id) r, cloudflare.zones.origin_tls_compliance_modes(z.id) c ORDER BY zone_name
  - name: "net_zaraz_config"
    reference_sql: |
      SELECT z.name AS zone_name, c.dataLayer AS data_layer, json_extract(c.settings, '$.autoInjectScript')::BOOLEAN AS auto_inject_script FROM cloudflare.zones.zones z, cloudflare.zones.zaraz_config(z.id) c ORDER BY zone_name
  - name: "net_zaraz_default"
    reference_sql: |
      SELECT d.dataLayer AS data_layer, d.historyChange AS history_change, len(json_keys(d.triggers)) AS trigger_count FROM cloudflare.zones.zones z, cloudflare.zones.default(z.id) d WHERE z.name = 'query.farm'
  - name: "net_speed_availability"
    reference_sql: |
      SELECT json_extract_string(x.quota, '$.plan') AS plan, json_array_length(x.regions) AS region_count FROM cloudflare.zones.zones z, cloudflare.zones.availabilities(z.id) x WHERE z.name = 'query.farm'
  - name: "net_cloud_region_vendors"
    reference_sql: |
      SELECT k AS vendor, json_array_length(json_extract(x.vendors, '$.' || k)) AS region_count FROM cloudflare.zones.zones z, cloudflare.zones.cloud_regions_supported_regions(z.id) x, unnest(json_keys(x.vendors)) AS u(k) WHERE z.name = 'query.farm' ORDER BY vendor
  - name: "net_rum_sites"
    reference_sql: |
      SELECT count(*) AS total_sites, count(*) FILTER (WHERE s.auto_install) AS auto_installed_sites FROM cloudflare.accounts.accounts a, cloudflare.zones.site_info_list_by_account(a.id) s
  - name: "net_rum_sites_zone_literal"
    reference_sql: |
      SELECT json_extract_string(ruleset, '$.zone_name') AS zone_name, json_extract(ruleset, '$.lite')::BOOLEAN AS lite FROM cloudflare.zones.site_info_list WHERE account_id = 'bb68a133a66d26a310231495b13479a1' AND auto_install = true ORDER BY zone_name
  - name: "net_rum_site_lookup"
    reference_sql: |
      SELECT x.auto_install, count(*) AS sites, count(x.ruleset) AS sites_with_ruleset FROM cloudflare.accounts.accounts a, cloudflare.zones.site_info_list_by_account(a.id) s, cloudflare.zones.site(a.id, s.site_tag) x GROUP BY x.auto_install ORDER BY x.auto_install
  - name: "net_rules_lists"
    reference_sql: |
      SELECT l.name AS list_name, l.kind, l.num_items::INTEGER AS num_items FROM cloudflare.accounts.accounts a, cloudflare.zones.lists_by_account(a.id) l ORDER BY list_name
  - name: "net_rules_lists_literal"
    reference_sql: |
      SELECT kind, count(*) AS list_count, sum(num_items)::INTEGER AS total_items FROM cloudflare.zones.lists WHERE account_id = 'bb68a133a66d26a310231495b13479a1' GROUP BY kind ORDER BY kind
  - name: "net_redirect_list_items"
    reference_sql: |
      SELECT l.name AS list_name, json_extract_string(i.redirect, '$.source_url') AS source_url, json_extract_string(i.redirect, '$.target_url') AS target_url, json_extract(i.redirect, '$.include_subdomains')::BOOLEAN AS include_subdomains FROM cloudflare.accounts.accounts a, cloudflare.zones.lists_by_account(a.id) l, cloudflare.zones.items_by_list(a.id, l.id) i WHERE l.kind = 'redirect' ORDER BY list_name, source_url
  - name: "net_list_item_lookup"
    reference_sql: |
      SELECT l.name AS list_name, json_extract(x.redirect, '$.status_code')::INTEGER AS status_code, json_extract(x.redirect, '$.preserve_path_suffix')::BOOLEAN AS preserve_path_suffix FROM cloudflare.accounts.accounts a, cloudflare.zones.lists_by_account(a.id) l, cloudflare.zones.items_by_list(a.id, l.id) i, cloudflare.zones.item(a.id, l.id, i.id) x ORDER BY list_name, status_code
  - name: "net_list_detail_lookup"
    reference_sql: |
      SELECT x.name AS list_name, x.kind, x.num_items::INTEGER AS num_items, x.num_referencing_filters::INTEGER AS num_referencing_filters FROM cloudflare.accounts.accounts a, cloudflare.zones.lists_by_account(a.id) l, cloudflare.zones.lists_list(a.id, l.id) x ORDER BY list_name
  - name: "net_custom_pages_zone"
    reference_sql: |
      SELECT z.name AS zone_name, count(*) AS page_count, count(*) FILTER (WHERE c.state = 'default') AS default_pages FROM cloudflare.zones.zones z, cloudflare.zones.custom_pages_2_by_zone(z.id) c GROUP BY z.name ORDER BY zone_name
  - name: "net_custom_pages_account"
    reference_sql: |
      SELECT c.id AS page_id, c.description FROM cloudflare.accounts.accounts a, cloudflare.zones.custom_pages_by_account(a.id) c WHERE c.required_tokens LIKE '%::CAPTCHA_BOX::%' ORDER BY page_id
  - name: "net_custom_page_lookup"
    reference_sql: |
      SELECT x.id AS page_id, x.description, x.state, x.preview_target FROM cloudflare.accounts.accounts a, (VALUES ('500_errors'), ('under_attack')) v(pid), cloudflare.zones.custom_pages_by_id(a.id, v.pid) x ORDER BY page_id
  - name: "net_dns_types_all_zones"
    reference_sql: |
      SELECT r.type AS record_type, count(*) AS record_count FROM cloudflare.zones.zones z, cloudflare.dns.records_by_zone(z.id) r GROUP BY r.type ORDER BY record_count DESC, record_type
  - name: "net_dns_proxied_per_zone"
    reference_sql: |
      SELECT z.name AS zone_name, count(*) AS total_records, count(*) FILTER (WHERE r.proxied) AS proxied_records FROM cloudflare.zones.zones z, cloudflare.dns.records_by_zone(z.id) r GROUP BY z.name ORDER BY zone_name
  - name: "net_dns_qf_types_literal"
    reference_sql: |
      SELECT type AS record_type, count(*) AS record_count FROM cloudflare.dns.records WHERE zone_id = 'f762db64a4e321f026a26321acf2b65b' GROUP BY type ORDER BY record_type
  - name: "net_dns_mx_lookup"
    reference_sql: |
      SELECT z.name AS zone_name, x.content AS mail_server, x.ttl, x.proxied FROM cloudflare.zones.zones z, cloudflare.dns.records_by_zone(z.id) r, cloudflare.dns.record(z.id, r.id) x WHERE r.type = 'MX' ORDER BY zone_name, mail_server
  - name: "net_dns_usage_vs_quota"
    reference_sql: |
      SELECT z.name AS zone_name, u.record_usage, u.record_quota, round(u.record_usage * 100.0 / u.record_quota, 1) AS pct_used FROM cloudflare.zones.zones z, cloudflare.dns.usage_2(z.id) u ORDER BY record_usage DESC, zone_name
  - name: "net_dns_account_usage"
    reference_sql: |
      SELECT u.record_usage FROM cloudflare.accounts.accounts a, cloudflare.dns.usage(a.id) u
  - name: "net_dns_account_defaults"
    reference_sql: |
      SELECT json_extract(s.zone_defaults, '$.ns_ttl')::INTEGER AS ns_ttl, json_extract(s.zone_defaults, '$.soa.ttl')::INTEGER AS soa_ttl, json_extract(s.zone_defaults, '$.flatten_all_cnames')::BOOLEAN AS flatten_all_cnames FROM cloudflare.accounts.accounts a, cloudflare.dns.settings(a.id) s
  - name: "net_dnssec_status"
    reference_sql: |
      SELECT z.name AS zone_name, d.status AS dnssec_status FROM cloudflare.zones.zones z, cloudflare.dns.dnssec(z.id) d ORDER BY zone_name
  - name: "net_dns_zone_settings"
    reference_sql: |
      SELECT z.name AS zone_name, s.zone_mode, s.ns_ttl::INTEGER AS ns_ttl, json_extract(s.soa, '$.min_ttl')::INTEGER AS soa_min_ttl, s.flatten_all_cnames FROM cloudflare.zones.zones z, cloudflare.dns.settings_2(z.id) s ORDER BY zone_name
  - name: "net_dnssec_zsk"
    reference_sql: |
      SELECT z.name AS zone_name, k.Name AS zsk_name FROM cloudflare.zones.zones z, cloudflare.dns.zsk_by_zone(z.id) k ORDER BY zone_name, zsk_name
  - name: "net_dnssec_zsk_literal"
    reference_sql: |
      SELECT count(*) AS zsk_count FROM cloudflare.dns.zsk WHERE zone_id = '2773d099d622ee4f96691819eb2c1533'
  - name: "net_cert_packs_by_type"
    reference_sql: |
      SELECT z.name AS zone_name, c.type AS pack_type, count(*) AS pack_count FROM cloudflare.zones.zones z, cloudflare.ssl.certificate_packs_by_zone(z.id) c GROUP BY ALL ORDER BY zone_name, pack_type
  - name: "net_cert_packs_qf_literal"
    reference_sql: |
      SELECT certificate_authority, count(*) AS pack_count FROM cloudflare.ssl.certificate_packs WHERE zone_id = 'f762db64a4e321f026a26321acf2b65b' GROUP BY 1 ORDER BY 1
  - name: "net_universal_cert_lookup"
    reference_sql: |
      SELECT z.name AS zone_name, x.certificate_authority, x.status, x.validity_days FROM cloudflare.zones.zones z, cloudflare.ssl.certificate_packs_by_zone(z.id) c, cloudflare.ssl.certificate_pack(z.id, c.id) x WHERE c.type = 'universal' ORDER BY zone_name
  - name: "net_ssl_verification"
    reference_sql: |
      SELECT z.name AS zone_name, v.certificate_status, v.validation_method FROM cloudflare.zones.zones z, cloudflare.ssl.verification_by_zone(z.id) v ORDER BY zone_name
  - name: "net_ssl_verification_literal"
    reference_sql: |
      SELECT cert_pack_uuid, certificate_status FROM cloudflare.ssl.verification WHERE zone_id = 'f762db64a4e321f026a26321acf2b65b' ORDER BY cert_pack_uuid
  - name: "net_ssl_advanced_quota"
    reference_sql: |
      SELECT z.name AS zone_name, json_extract(q.advanced, '$.used')::INTEGER AS advanced_used FROM cloudflare.zones.zones z, cloudflare.ssl.quota(z.id) q ORDER BY advanced_used DESC, zone_name
  - name: "net_ssl_universal_total_tls"
    reference_sql: |
      SELECT z.name AS zone_name, u.enabled AS universal_ssl_enabled, t.enabled AS total_tls_enabled FROM cloudflare.zones.zones z, cloudflare.ssl.universal_settings(z.id) u, cloudflare.ssl.total_tls(z.id) t ORDER BY zone_name
  - name: "net_ssl_ct_alerting_origin_auth"
    reference_sql: |
      SELECT z.name AS zone_name, a.enabled AS ct_alerting_enabled, s.enabled AS origin_client_auth_enabled FROM cloudflare.zones.zones z, cloudflare.ssl.alerting(z.id) a, cloudflare.ssl.settings(z.id) s ORDER BY zone_name
  - name: "net_dcv_delegation_uuid"
    reference_sql: |
      SELECT z.name AS zone_name, u.uuid AS dcv_uuid FROM cloudflare.zones.zones z, cloudflare.ssl.uuid(z.id) u ORDER BY zone_name
  - name: "net_mtls_certs_services"
    reference_sql: |
      SELECT m.type AS cert_type, m.ca AS is_ca, m.expires_on, s.service, s.status AS association_status FROM cloudflare.accounts.accounts a, cloudflare.ssl.mtls_certificates_by_account(a.id) m, cloudflare.ssl.associations_by_mtls_certificate(a.id, m.id) s ORDER BY expires_on, service
  - name: "net_mtls_cert_lookup"
    reference_sql: |
      SELECT x.type AS cert_type, x.ca AS is_ca, year(x.uploaded_on) AS uploaded_year, year(x.expires_on) AS expires_year FROM cloudflare.accounts.accounts a, cloudflare.ssl.mtls_certificates_by_account(a.id) m, cloudflare.ssl.mtls_certificate(a.id, m.id) x ORDER BY cert_type, uploaded_year
  - name: "net_mtls_certs_literal"
    reference_sql: |
      SELECT count(*) AS total_certs, count(*) FILTER (WHERE ca) AS ca_certs FROM cloudflare.ssl.mtls_certificates WHERE account_id = 'bb68a133a66d26a310231495b13479a1'
  - name: "net_email_routing_dns_required"
    reference_sql: |
      SELECT z.name AS zone_name, e.type AS record_type, count(*) AS record_count FROM cloudflare.zones.zones z, cloudflare.email.dns_by_zone(z.id) e GROUP BY ALL ORDER BY zone_name, record_type
  - name: "net_email_routing_dns_literal"
    reference_sql: |
      SELECT priority::INTEGER AS mx_priority FROM cloudflare.email.dns WHERE zone_id = '2773d099d622ee4f96691819eb2c1533' AND type = 'MX' ORDER BY mx_priority
  - name: "net_email_routing_rules"
    reference_sql: |
      SELECT z.name AS zone_name, r.enabled, json_extract_string(r.matchers, '$[0].type') AS matcher_type, json_extract_string(r.actions, '$[0].type') AS action_type FROM cloudflare.zones.zones z, cloudflare.email.routing_rules_by_zone(z.id) r ORDER BY zone_name, matcher_type
  - name: "net_email_routing_rules_literal"
    reference_sql: |
      SELECT count(*) AS total_rules, count(*) FILTER (WHERE enabled) AS enabled_rules FROM cloudflare.email.routing_rules WHERE zone_id = 'f762db64a4e321f026a26321acf2b65b'
  - name: "net_email_catch_all_status"
    reference_sql: |
      SELECT z.name AS zone_name, r.status AS routing_status, r.enabled AS routing_enabled, c.enabled AS catch_all_enabled, json_extract_string(c.actions, '$[0].type') AS catch_all_action FROM cloudflare.zones.zones z, cloudflare.email.routing(z.id) r, cloudflare.email.catch_all(z.id) c ORDER BY zone_name
  - name: "net_email_dmarc_reports"
    reference_sql: |
      SELECT z.name AS zone_name, d.enabled AS dmarc_reports_enabled FROM cloudflare.zones.zones z, cloudflare.email.dmarc_reports(z.id) d ORDER BY zone_name
  - name: "net_cloudflare_ip_ranges"
    reference_sql: |
      SELECT json_array_length(ipv4_cidrs) AS ipv4_ranges, json_array_length(ipv6_cidrs) AS ipv6_ranges FROM cloudflare.magic.ips
  - name: "net_regional_services_regions"
    reference_sql: |
      SELECT r.key AS region_key, r.label FROM cloudflare.accounts.accounts a, cloudflare.magic.regions_by_account(a.id) r ORDER BY region_key
  - name: "net_regional_regions_literal"
    reference_sql: |
      SELECT count(*) AS region_count FROM cloudflare.magic.regions WHERE account_id = 'bb68a133a66d26a310231495b13479a1'
  - name: "net_addressing_services"
    reference_sql: |
      SELECT s.name AS service_name FROM cloudflare.accounts.accounts a, cloudflare.magic.services_by_account(a.id) s ORDER BY service_name
  - name: "net_addressing_services_literal"
    reference_sql: |
      SELECT count(*) AS service_count FROM cloudflare.magic.services WHERE account_id = 'bb68a133a66d26a310231495b13479a1'
  - name: "net_cni_default_asn"
    reference_sql: |
      SELECT s.default_asn FROM cloudflare.accounts.accounts a, cloudflare.magic.settings(a.id) s
  - name: "net_api_labels_per_zone"
    reference_sql: |
      SELECT z.name AS zone_name, l.source, count(*) AS label_count FROM cloudflare.zones.zones z, cloudflare.api_gateway.labels_by_zone(z.id) l GROUP BY ALL ORDER BY zone_name, source
  - name: "net_api_labels_literal"
    reference_sql: |
      SELECT name AS label_name, (created_at AT TIME ZONE 'UTC')::DATE AS created_date FROM cloudflare.api_gateway.labels WHERE zone_id = 'f762db64a4e321f026a26321acf2b65b' AND created_at >= TIMESTAMPTZ '2025-01-01 00:00:00+00' ORDER BY created_date, label_name
  - name: "net_api_managed_label_lookup"
    reference_sql: |
      SELECT x.name AS label_name, x.source, x.description FROM cloudflare.zones.zones z, cloudflare.api_gateway.managed(z.id, 'cf-log-in') x WHERE z.name = 'query.farm'
  - name: "net_http_daily_qf_week"
    reference_sql: |
      SELECT date, requests, cached_requests, threats, unique_visitors FROM cloudflare.analytics.http_requests_daily WHERE zone_id = 'f762db64a4e321f026a26321acf2b65b' AND date BETWEEN DATE '2026-09-01' AND DATE '2026-09-07' ORDER BY date
  - name: "net_http_daily_qf_totals"
    reference_sql: |
      SELECT sum(requests) AS total_requests, sum(threats) AS total_threats, max(unique_visitors) AS peak_unique_visitors, arg_max(date, threats) AS worst_threat_day FROM cloudflare.analytics.http_requests_daily WHERE zone_id = 'f762db64a4e321f026a26321acf2b65b' AND date BETWEEN DATE '2026-09-01' AND DATE '2026-09-07'
