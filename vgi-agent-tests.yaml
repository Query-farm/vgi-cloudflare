# Private graders for vgi_cloudflare/agent_tasks.json, keyed by task name.
# Generated by tools/agent_tasks.py; run with `vgi-lint simulate` (see vgi-lint.toml).
tasks:
  - name: "radar_a_email_auth_pass_ranking"
    reference_sql: |
      SELECT check_name, round(pass_pct, 0) AS pass_pct FROM (
        SELECT 'DKIM' AS check_name, (summary_0->>'PASS')::DOUBLE AS pass_pct FROM cloudflare.radar.dkim()
        UNION ALL SELECT 'DMARC', (summary_0->>'PASS')::DOUBLE FROM cloudflare.radar.dmarc()
        UNION ALL SELECT 'ARC', (summary_0->>'PASS')::DOUBLE FROM cloudflare.radar.arc()
      ) ORDER BY pass_pct DESC
  - name: "radar_a_email_dkim_outcomes"
    reference_sql: |
      SELECT k AS outcome, round(v, 0) AS share_pct FROM (SELECT e.key AS k, e.value::DOUBLE AS v FROM cloudflare.radar.dkim(), unnest(map_entries(summary_0::JSON::MAP(VARCHAR, VARCHAR))) AS t(e)) ORDER BY v DESC
  - name: "radar_a_email_encrypted_pct"
    reference_sql: |
      SELECT round((summary_0->>'ENCRYPTED')::DOUBLE, 0) AS encrypted_pct FROM cloudflare.radar.encrypted()
  - name: "radar_a_email_malicious_ratio"
    reference_sql: |
      SELECT round((summary_0->>'NOT_MALICIOUS')::DOUBLE / (summary_0->>'MALICIOUS')::DOUBLE, 0) AS clean_per_malicious FROM cloudflare.radar.malicious()
  - name: "radar_a_email_malicious_top_tld"
    reference_sql: |
      SELECT json_extract_string(top_0, '$[0].name') AS tld FROM cloudflare.radar.malicious_malicious('MALICIOUS')
  - name: "radar_a_l3_bitrate_buckets"
    reference_sql: |
      SELECT k AS bitrate_bucket FROM (SELECT e.key AS k, e.value::DOUBLE AS v FROM cloudflare.radar.bitrate(), unnest(map_entries(summary_0::JSON::MAP(VARCHAR, VARCHAR))) AS t(e)) ORDER BY v DESC
  - name: "radar_a_l3_duration_top3"
    reference_sql: |
      SELECT row_number() OVER (ORDER BY v DESC) AS rank, k AS duration_bucket FROM (SELECT e.key AS k, e.value::DOUBLE AS v FROM cloudflare.radar.duration(), unnest(map_entries(summary_0::JSON::MAP(VARCHAR, VARCHAR))) AS t(e)) ORDER BY rank LIMIT 3
  - name: "radar_a_l3_target_industries_top3"
    reference_sql: |
      SELECT row_number() OVER (ORDER BY v DESC) AS rank, k AS industry FROM (SELECT e.key AS k, e.value::DOUBLE AS v FROM cloudflare.radar.industry(), unnest(map_entries(summary_0::JSON::MAP(VARCHAR, VARCHAR))) AS t(e)) WHERE k <> 'other' ORDER BY rank LIMIT 3
  - name: "radar_a_l3_protocol_avg_share"
    reference_sql: |
      SELECT k AS protocol, round(avg(v), 0) AS avg_share_pct FROM (WITH m AS (SELECT serie_0::JSON::MAP(VARCHAR, VARCHAR[]) AS mm FROM cloudflare.radar.layer3_timeseries_groups_protocol()) SELECT k, v::DOUBLE AS v FROM m, unnest(map_keys(mm)) AS a(k), unnest(mm[k]) AS b(v) WHERE k <> 'timestamps') GROUP BY k ORDER BY avg(v) DESC LIMIT 1
  - name: "radar_a_l3_summary_protocol"
    reference_sql: |
      SELECT k AS protocol FROM (SELECT e.key AS k, e.value::DOUBLE AS v FROM cloudflare.radar.layer3_summary_dimension('PROTOCOL'), unnest(map_entries(summary_0::JSON::MAP(VARCHAR, VARCHAR))) AS t(e)) ORDER BY v DESC
  - name: "radar_a_l7_mitigation_top2"
    reference_sql: |
      SELECT row_number() OVER (ORDER BY v DESC) AS rank, k AS product FROM (SELECT e.key AS k, e.value::DOUBLE AS v FROM cloudflare.radar.mitigation_product(), unnest(map_entries(summary_0::JSON::MAP(VARCHAR, VARCHAR))) AS t(e)) ORDER BY rank LIMIT 2
  - name: "radar_a_l7_managed_rules_top"
    reference_sql: |
      SELECT k AS rule_category, round(v, 0) AS share_pct FROM (SELECT e.key AS k, e.value::DOUBLE AS v FROM cloudflare.radar.managed_rules(), unnest(map_entries(summary_0::JSON::MAP(VARCHAR, VARCHAR))) AS t(e)) WHERE k <> 'other' ORDER BY v DESC LIMIT 1
  - name: "radar_a_l7_http_method_top3"
    reference_sql: |
      SELECT row_number() OVER (ORDER BY v DESC) AS rank, k AS http_method FROM (SELECT e.key AS k, e.value::DOUBLE AS v FROM cloudflare.radar.http_method(), unnest(map_entries(summary_0::JSON::MAP(VARCHAR, VARCHAR))) AS t(e)) ORDER BY rank LIMIT 3
  - name: "radar_a_l7_http_versions"
    reference_sql: |
      SELECT k AS http_version FROM (SELECT e.key AS k, e.value::DOUBLE AS v FROM cloudflare.radar.http_versions(), unnest(map_entries(summary_0::JSON::MAP(VARCHAR, VARCHAR))) AS t(e)) ORDER BY v DESC
  - name: "radar_a_l7_top_industry_vertical"
    reference_sql: |
      SELECT (SELECT json_extract_string(top_0, '$[0].name') FROM cloudflare.radar.layer7_top_industry()) AS top_industry,
             (SELECT json_extract_string(top_0, '$[0].name') FROM cloudflare.radar.layer7_top_vertical()) AS top_vertical
  - name: "radar_a_l7_industry_timeseries"
    reference_sql: |
      SELECT k AS industry FROM (WITH m AS (SELECT serie_0::JSON::MAP(VARCHAR, VARCHAR[]) AS mm FROM cloudflare.radar.layer7_timeseries_groups_industry()) SELECT k, v::DOUBLE AS v FROM m, unnest(map_keys(mm)) AS a(k), unnest(mm[k]) AS b(v) WHERE k <> 'timestamps') WHERE k <> 'other' GROUP BY k ORDER BY avg(v) DESC LIMIT 1
  - name: "radar_a_l7_vertical_timeseries"
    reference_sql: |
      SELECT k AS vertical FROM (WITH m AS (SELECT serie_0::JSON::MAP(VARCHAR, VARCHAR[]) AS mm FROM cloudflare.radar.layer7_timeseries_groups_vertical()) SELECT k, v::DOUBLE AS v FROM m, unnest(map_keys(mm)) AS a(k), unnest(mm[k]) AS b(v) WHERE k <> 'timestamps') WHERE k <> 'other' GROUP BY k ORDER BY avg(v) DESC LIMIT 1
  - name: "radar_a_l7_summary_ip_version"
    reference_sql: |
      SELECT round(v, 0) AS ipv4_pct FROM (SELECT e.key AS k, e.value::DOUBLE AS v FROM cloudflare.radar.layer7_summary_dimension('IP_VERSION'), unnest(map_entries(summary_0::JSON::MAP(VARCHAR, VARCHAR))) AS t(e)) WHERE k = 'IPv4'
  - name: "radar_a_l7_method_timeseries"
    reference_sql: |
      SELECT k AS http_method, round(avg(v), 0) AS avg_share_pct FROM (WITH m AS (SELECT serie_0::JSON::MAP(VARCHAR, VARCHAR[]) AS mm FROM cloudflare.radar.layer7_timeseries_groups_dimension('HTTP_METHOD')) SELECT k, v::DOUBLE AS v FROM m, unnest(map_keys(mm)) AS a(k), unnest(mm[k]) AS b(v) WHERE k <> 'timestamps') GROUP BY k ORDER BY avg(v) DESC LIMIT 1
  - name: "radar_a_l7_origin_as_top"
    reference_sql: |
      SELECT json_extract_string(top_0, '$[0].originAsn')::INTEGER AS origin_asn, json_extract_string(top_0, '$[0].originAsnName') AS origin_as_name FROM cloudflare.radar.ases_origin()
  - name: "radar_a_l7_origin_target_countries"
    reference_sql: |
      SELECT (SELECT json_extract_string(top_0, '$[0].originCountryName') FROM cloudflare.radar.locations_origin()) AS top_origin_country,
             (SELECT json_extract_string(top_0, '$[0].targetCountryName') FROM cloudflare.radar.locations_target()) AS top_target_country
  - name: "radar_a_l7_target_top2"
    reference_sql: |
      SELECT (r.e->>'rank')::INTEGER AS rank, r.e->>'targetCountryName' AS target_country
      FROM cloudflare.radar.locations_target(), unnest(from_json(top_0, '["JSON"]')) AS r(e) ORDER BY rank LIMIT 2
  - name: "radar_a_http_bot_share"
    reference_sql: |
      SELECT round((summary_0->>'bot')::DOUBLE, 0) AS bot_pct FROM cloudflare.radar.bot_class()
  - name: "radar_a_http_device_split"
    reference_sql: |
      SELECT round((summary_0->>'desktop')::DOUBLE, 0) AS desktop_pct, round((summary_0->>'mobile')::DOUBLE, 0) AS mobile_pct FROM cloudflare.radar.device_type()
  - name: "radar_a_http_https_share"
    reference_sql: |
      SELECT round((summary_0->>'https')::DOUBLE, 0) AS https_pct FROM cloudflare.radar.http_protocol()
  - name: "radar_a_http_os_top2"
    reference_sql: |
      SELECT row_number() OVER (ORDER BY v DESC) AS rank, k AS os FROM (SELECT e.key AS k, e.value::DOUBLE AS v FROM cloudflare.radar.http_summary_dimension('OS'), unnest(map_entries(summary_0::JSON::MAP(VARCHAR, VARCHAR))) AS t(e)) ORDER BY rank LIMIT 2
  - name: "radar_a_http_device_timeseries"
    reference_sql: |
      SELECT round(avg(v), 0) AS mobile_avg_pct FROM (WITH m AS (SELECT serie_0::JSON::MAP(VARCHAR, VARCHAR[]) AS mm FROM cloudflare.radar.http_timeseries_groups_dimension('DEVICE_TYPE')) SELECT k, v::DOUBLE AS v FROM m, unnest(map_keys(mm)) AS a(k), unnest(mm[k]) AS b(v) WHERE k <> 'timestamps') WHERE k = 'mobile'
  - name: "radar_a_http_top_browser"
    reference_sql: |
      SELECT k AS browser FROM (WITH m AS (SELECT serie_0::JSON::MAP(VARCHAR, VARCHAR[]) AS mm FROM cloudflare.radar.browser()) SELECT k, v::DOUBLE AS v FROM m, unnest(map_keys(mm)) AS a(k), unnest(mm[k]) AS b(v) WHERE k <> 'timestamps') GROUP BY k ORDER BY avg(v) DESC LIMIT 1
  - name: "radar_a_http_top_browser_family"
    reference_sql: |
      SELECT k AS browser_family FROM (WITH m AS (SELECT serie_0::JSON::MAP(VARCHAR, VARCHAR[]) AS mm FROM cloudflare.radar.browser_family()) SELECT k, v::DOUBLE AS v FROM m, unnest(map_keys(mm)) AS a(k), unnest(mm[k]) AS b(v) WHERE k <> 'timestamps') GROUP BY k ORDER BY avg(v) DESC LIMIT 1
  - name: "radar_a_http_top_country"
    reference_sql: |
      SELECT json_extract_string(top_0, '$[0].clientCountryAlpha2') AS country_code, json_extract_string(top_0, '$[0].clientCountryName') AS country_name FROM cloudflare.radar.http_top_locations()
  - name: "radar_a_http_v3_top_country"
    reference_sql: |
      SELECT json_extract_string(top_0, '$[0].clientCountryName') AS country_name FROM cloudflare.radar.http_version_http_version('HTTPv3')
  - name: "radar_a_http_plain_http_top_as"
    reference_sql: |
      SELECT json_extract_string(top_0, '$[0].clientASN')::INTEGER AS asn, json_extract_string(top_0, '$[0].clientASName') AS as_name FROM cloudflare.radar.http_protocol_http_protocol('HTTP')
  - name: "radar_a_http_firefox_top_as"
    reference_sql: |
      SELECT json_extract_string(top_0, '$[0].clientASN')::INTEGER AS asn, json_extract_string(top_0, '$[0].clientASName') AS as_name FROM cloudflare.radar.browser_family_browser_family('FIREFOX')
  - name: "radar_a_http_safari_top_country"
    reference_sql: |
      SELECT json_extract_string(top_0, '$[0].clientCountryName') AS country_name FROM cloudflare.radar.locations_browser_family_browser_family('SAFARI')
  - name: "radar_a_http_ipv6_top_country"
    reference_sql: |
      SELECT json_extract_string(top_0, '$[0].clientCountryAlpha2') AS country_code, json_extract_string(top_0, '$[0].clientCountryName') AS country_name FROM cloudflare.radar.locations_ip_version_ip_version('IPv6')
  - name: "radar_a_http_automated_top_country"
    reference_sql: |
      SELECT json_extract_string(top_0, '$[0].clientCountryName') AS country_name FROM cloudflare.radar.locations_bot_class_bot_class('LIKELY_AUTOMATED')
  - name: "radar_a_dns_udp_share"
    reference_sql: |
      SELECT round((summary_0->>'UDP')::DOUBLE, 0) AS udp_pct FROM cloudflare.radar.summary_protocol()
  - name: "radar_a_dns_cache_hit"
    reference_sql: |
      SELECT round((summary_0->>'POSITIVE')::DOUBLE, 0) AS cache_hit_pct FROM cloudflare.radar.cache_hit()
  - name: "radar_a_dns_matching_answer"
    reference_sql: |
      SELECT k AS more_common FROM (SELECT e.key AS k, e.value::DOUBLE AS v FROM cloudflare.radar.matching_answer(), unnest(map_entries(summary_0::JSON::MAP(VARCHAR, VARCHAR))) AS t(e)) ORDER BY v DESC LIMIT 1
  - name: "radar_a_dns_top_client_as"
    reference_sql: |
      SELECT json_extract_string(top_0, '$[0].clientASN')::INTEGER AS asn, json_extract_string(top_0, '$[0].clientASName') AS as_name FROM cloudflare.radar.dns_top_ases()
  - name: "radar_a_dns_top_client_country"
    reference_sql: |
      SELECT json_extract_string(top_0, '$[0].clientCountryName') AS country_name FROM cloudflare.radar.dns_top_locations()
  - name: "radar_a_dns_query_type_top2"
    reference_sql: |
      SELECT row_number() OVER (ORDER BY avg(v) DESC) AS rank, k AS query_type FROM (WITH m AS (SELECT serie_0::JSON::MAP(VARCHAR, VARCHAR[]) AS mm FROM cloudflare.radar.dns_timeseries_groups_query_type()) SELECT k, v::DOUBLE AS v FROM m, unnest(map_keys(mm)) AS a(k), unnest(mm[k]) AS b(v) WHERE k <> 'timestamps') GROUP BY k ORDER BY rank LIMIT 2
  - name: "radar_a_dns_protocol_timeseries"
    reference_sql: |
      SELECT round(avg(v), 0) AS udp_avg_pct FROM (WITH m AS (SELECT serie_0::JSON::MAP(VARCHAR, VARCHAR[]) AS mm FROM cloudflare.radar.dns_timeseries_groups_protocol()) SELECT k, v::DOUBLE AS v FROM m, unnest(map_keys(mm)) AS a(k), unnest(mm[k]) AS b(v) WHERE k <> 'timestamps') WHERE k = 'UDP'
  - name: "radar_a_dns_dnssec_status_timeseries"
    reference_sql: |
      SELECT k AS dnssec_status FROM (WITH m AS (SELECT serie_0::JSON::MAP(VARCHAR, VARCHAR[]) AS mm FROM cloudflare.radar.dns_timeseries_groups_dnssec()) SELECT k, v::DOUBLE AS v FROM m, unnest(map_keys(mm)) AS a(k), unnest(mm[k]) AS b(v) WHERE k <> 'timestamps') GROUP BY k ORDER BY avg(v) DESC LIMIT 1
  - name: "radar_a_dns_summary_query_type"
    reference_sql: |
      SELECT k AS query_type, round(v, 0) AS share_pct FROM (SELECT e.key AS k, e.value::DOUBLE AS v FROM cloudflare.radar.dns_summary_dimension('QUERY_TYPE'), unnest(map_entries(summary_0::JSON::MAP(VARCHAR, VARCHAR))) AS t(e)) ORDER BY v DESC LIMIT 1
  - name: "radar_a_dns_ipversion_timeseries"
    reference_sql: |
      SELECT round(avg(v), 0) AS ipv4_avg_pct FROM (WITH m AS (SELECT serie_0::JSON::MAP(VARCHAR, VARCHAR[]) AS mm FROM cloudflare.radar.dns_timeseries_groups_dimension('IP_VERSION')) SELECT k, v::DOUBLE AS v FROM m, unnest(map_keys(mm)) AS a(k), unnest(mm[k]) AS b(v) WHERE k <> 'timestamps') WHERE k = 'IPv4'
  - name: "radar_a_as112_dnssec_edns"
    reference_sql: |
      SELECT (SELECT round((summary_0->>'SUPPORTED')::DOUBLE, 0) FROM cloudflare.radar.dnssec()) AS dnssec_pct,
             (SELECT round((summary_0->>'SUPPORTED')::DOUBLE, 0) FROM cloudflare.radar.edns()) AS edns_pct
  - name: "radar_a_as112_ipv6_share"
    reference_sql: |
      SELECT round((summary_0->>'IPv6')::DOUBLE, 0) AS ipv6_pct FROM cloudflare.radar.ip_versions()
  - name: "radar_a_as112_protocol_top"
    reference_sql: |
      SELECT k AS protocol FROM (SELECT e.key AS k, e.value::DOUBLE AS v FROM cloudflare.radar.summary_dimension('PROTOCOL'), unnest(map_entries(summary_0::JSON::MAP(VARCHAR, VARCHAR))) AS t(e)) ORDER BY v DESC LIMIT 1
  - name: "radar_a_as112_querytype_timeseries"
    reference_sql: |
      SELECT k AS query_type FROM (WITH m AS (SELECT serie_0::JSON::MAP(VARCHAR, VARCHAR[]) AS mm FROM cloudflare.radar.timeseries_groups_dimension('QUERY_TYPE')) SELECT k, v::DOUBLE AS v FROM m, unnest(map_keys(mm)) AS a(k), unnest(mm[k]) AS b(v) WHERE k <> 'timestamps') GROUP BY k ORDER BY avg(v) DESC LIMIT 1
  - name: "radar_a_as112_dnssec_top_country"
    reference_sql: |
      SELECT json_extract_string(top_0, '$[0].clientCountryName') AS country_name FROM cloudflare.radar.dnssec_dnssec('SUPPORTED')
  - name: "radar_a_as112_edns_top_country"
    reference_sql: |
      SELECT json_extract_string(top_0, '$[0].clientCountryName') AS country_name FROM cloudflare.radar.edns_edns('SUPPORTED')
  - name: "radar_a_as112_ipv4_top_country"
    reference_sql: |
      SELECT json_extract_string(top_0, '$[0].clientCountryName') AS country_name FROM cloudflare.radar.ip_version('IPv4')
  - name: "radar_a_bots_category_top2"
    reference_sql: |
      SELECT row_number() OVER (ORDER BY v DESC) AS rank, k AS bot_category FROM (SELECT e.key AS k, e.value::DOUBLE AS v FROM cloudflare.radar.bots_summary_dimension('BOT_CATEGORY'), unnest(map_entries(summary_0::JSON::MAP(VARCHAR, VARCHAR))) AS t(e)) WHERE k <> 'other' ORDER BY rank LIMIT 2
  - name: "radar_a_bots_kind_timeseries"
    reference_sql: |
      SELECT k AS bot_kind FROM (WITH m AS (SELECT serie_0::JSON::MAP(VARCHAR, VARCHAR[]) AS mm FROM cloudflare.radar.bots_timeseries_groups_dimension('BOT_KIND')) SELECT k, v::DOUBLE AS v FROM m, unnest(map_keys(mm)) AS a(k), unnest(mm[k]) AS b(v) WHERE k <> 'timestamps') GROUP BY k ORDER BY avg(v) DESC LIMIT 1
  - name: "radar_a_crawlers_client_type"
    reference_sql: |
      SELECT k AS client_type FROM (SELECT e.key AS k, e.value::DOUBLE AS v FROM cloudflare.radar.crawlers_summary_dimension('CLIENT_TYPE'), unnest(map_entries(summary_0::JSON::MAP(VARCHAR, VARCHAR))) AS t(e)) ORDER BY v DESC
  - name: "radar_a_crawlers_client_type_timeseries"
    reference_sql: |
      SELECT k AS client_type FROM (WITH m AS (SELECT serie_0::JSON::MAP(VARCHAR, VARCHAR[]) AS mm FROM cloudflare.radar.crawlers_timeseries_groups_dimension('CLIENT_TYPE')) SELECT k, v::DOUBLE AS v FROM m, unnest(map_keys(mm)) AS a(k), unnest(mm[k]) AS b(v) WHERE k <> 'timestamps') GROUP BY k ORDER BY avg(v) DESC LIMIT 1
  - name: "radar_a_bot_detail_gptbot"
    reference_sql: |
      SELECT bot->>'operator' AS operator, bot->>'category' AS category, bot->>'kind' AS kind FROM cloudflare.radar.bot_slug('gptbot')
  - name: "radar_a_ai_inference_top_model"
    reference_sql: |
      SELECT k AS model FROM (SELECT e.key AS k, e.value::DOUBLE AS v FROM cloudflare.radar.model(), unnest(map_entries(summary_0::JSON::MAP(VARCHAR, VARCHAR))) AS t(e)) ORDER BY v DESC LIMIT 1
  - name: "radar_a_ai_inference_task_top"
    reference_sql: |
      SELECT k AS task FROM (SELECT e.key AS k, e.value::DOUBLE AS v FROM cloudflare.radar.inference_summary_dimension('TASK'), unnest(map_entries(summary_0::JSON::MAP(VARCHAR, VARCHAR))) AS t(e)) WHERE k <> 'other' ORDER BY v DESC LIMIT 1
  - name: "radar_a_ai_inference_task_timeseries"
    reference_sql: |
      SELECT k AS task FROM (WITH m AS (SELECT serie_0::JSON::MAP(VARCHAR, VARCHAR[]) AS mm FROM cloudflare.radar.inference_timeseries_groups_dimension('TASK')) SELECT k, v::DOUBLE AS v FROM m, unnest(map_keys(mm)) AS a(k), unnest(mm[k]) AS b(v) WHERE k <> 'timestamps') WHERE k <> 'other' GROUP BY k ORDER BY avg(v) DESC LIMIT 1
  - name: "radar_a_robots_top_ai_agent"
    reference_sql: |
      SELECT json_extract_string(top_0, '$[0].name') AS user_agent, json_extract_string(top_0, '$[0].value')::INTEGER AS domains FROM cloudflare.radar.directive()
  - name: "radar_a_robots_top_domain_category"
    reference_sql: |
      SELECT json_extract_string(top_0, '$[0].name') AS domain_category FROM cloudflare.radar.domain_categories()
  - name: "radar_a_agent_readiness_top_check"
    reference_sql: |
      SELECT k AS check_name, v::BIGINT AS sites FROM (SELECT e.key AS k, e.value::DOUBLE AS v FROM cloudflare.radar.dimension('CHECK'), unnest(map_entries(summary_0::JSON::MAP(VARCHAR, VARCHAR))) AS t(e)) ORDER BY v DESC LIMIT 1
  - name: "radar_a_leaked_creds_compromised"
    reference_sql: |
      SELECT round((summary_0->>'COMPROMISED')::DOUBLE, 0) AS compromised_pct FROM cloudflare.radar.compromised()
  - name: "radar_a_leaked_creds_bot_class"
    reference_sql: |
      SELECT k AS bot_class FROM (SELECT e.key AS k, e.value::DOUBLE AS v FROM cloudflare.radar.leaked_credential_checks_summary_dimension('BOT_CLASS'), unnest(map_entries(summary_0::JSON::MAP(VARCHAR, VARCHAR))) AS t(e)) ORDER BY v DESC LIMIT 1
  - name: "radar_a_leaked_creds_bot_timeseries"
    reference_sql: |
      SELECT k AS bot_class FROM (WITH m AS (SELECT serie_0::JSON::MAP(VARCHAR, VARCHAR[]) AS mm FROM cloudflare.radar.leaked_credential_checks_timeseries_groups_bot_class()) SELECT k, v::DOUBLE AS v FROM m, unnest(map_keys(mm)) AS a(k), unnest(mm[k]) AS b(v) WHERE k <> 'timestamps') GROUP BY k ORDER BY avg(v) DESC LIMIT 1
  - name: "radar_a_leaked_creds_clean_timeseries"
    reference_sql: |
      SELECT k AS status FROM (WITH m AS (SELECT serie_0::JSON::MAP(VARCHAR, VARCHAR[]) AS mm FROM cloudflare.radar.leaked_credential_checks_timeseries_groups_dimension('COMPROMISED')) SELECT k, v::DOUBLE AS v FROM m, unnest(map_keys(mm)) AS a(k), unnest(mm[k]) AS b(v) WHERE k <> 'timestamps') GROUP BY k ORDER BY avg(v) DESC LIMIT 1
  - name: "radar_a_netflows_http_share"
    reference_sql: |
      SELECT round((summary_0->>'HTTP')::DOUBLE, 0) AS http_pct FROM cloudflare.radar.summary()
  - name: "radar_a_netflows_top_location"
    reference_sql: |
      SELECT k AS location FROM (SELECT e.key AS k, e.value::DOUBLE AS v FROM cloudflare.radar.netflows_summary_dimension('LOCATION'), unnest(map_entries(summary_0::JSON::MAP(VARCHAR, VARCHAR))) AS t(e)) WHERE k <> 'other' ORDER BY v DESC LIMIT 1
  - name: "radar_a_netflows_product_timeseries"
    reference_sql: |
      SELECT round(avg(v), 0) AS http_avg_pct FROM (WITH m AS (SELECT serie_0::JSON::MAP(VARCHAR, VARCHAR[]) AS mm FROM cloudflare.radar.netflows_timeseries_groups_dimension('PRODUCT')) SELECT k, v::DOUBLE AS v FROM m, unnest(map_keys(mm)) AS a(k), unnest(mm[k]) AS b(v) WHERE k <> 'timestamps') WHERE k = 'HTTP'
  - name: "radar_a_ct_top_ca_owner"
    reference_sql: |
      SELECT k AS ca_owner FROM (SELECT e.key AS k, e.value::DOUBLE AS v FROM cloudflare.radar.ct_summary_dimension('CA_OWNER'), unnest(map_entries(summary_0::JSON::MAP(VARCHAR, VARCHAR))) AS t(e)) WHERE k <> 'other' ORDER BY v DESC LIMIT 1
  - name: "radar_a_ct_ca_owner_timeseries_top2"
    reference_sql: |
      SELECT row_number() OVER (ORDER BY sum(v) DESC) AS rank, k AS ca_owner FROM (WITH m AS (SELECT serie_0::JSON::MAP(VARCHAR, VARCHAR[]) AS mm FROM cloudflare.radar.ct_timeseries_groups_dimension('CA_OWNER')) SELECT k, v::DOUBLE AS v FROM m, unnest(map_keys(mm)) AS a(k), unnest(mm[k]) AS b(v) WHERE k <> 'timestamps') WHERE k <> 'other' GROUP BY k ORDER BY rank LIMIT 2
  - name: "radar_a_ct_log_operator"
    reference_sql: |
      SELECT certificateLog->>'operator' AS operator, certificateLog->>'api' AS api FROM cloudflare.radar.log_slug('aquamarine2026h2')
  - name: "radar_a_ct_ca_lookup"
    reference_sql: |
      SELECT certificateAuthority->>'name' AS ca_name, certificateAuthority->>'countryName' AS country_name FROM cloudflare.radar.ca_slug('75AA1CBE7CB4BCD66518242B1989E36830107AB181602E7C079AC43767EB0BEA')
  - name: "radar_a_pt_asns_by_population"
    reference_sql: |
